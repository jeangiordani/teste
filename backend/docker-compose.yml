
services:
  postgres:
    image: postgres:18
    container_name: backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "9177"
      POSTGRES_DB: backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backend"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: "9177"
      DB_DATABASE: backend
      DB_SYNCHRONIZE: "true"

      JWT_SECRET: "secret"

      SEED_ADMIN_NAME: "Administrador"
      SEED_ADMIN_EMAIL: "admin@localhost.com"
      SEED_ADMIN_PASSWORD: "admin123"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
