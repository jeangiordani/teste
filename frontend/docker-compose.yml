version: "3.8"

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000/api
    container_name: frontend-app
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped